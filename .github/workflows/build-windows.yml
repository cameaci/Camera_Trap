name: Build Windows installer

# WSP CameraTrap Windows installer (per-user NSIS, no admin rights needed).
#
# Triggers:
# - a pushed tag v* (e.g. v1.0.0): builds the installer and publishes it as
#   a GitHub release of that tag (a pre-release when the tag has a "-").
# - a push that changes VERSION on main or a claude/** branch: same, for
#   tag v<VERSION>, created on that commit. Releasing is then just a commit
#   that bumps VERSION. A "-dev" version publishes nothing (a change to
#   this file then just builds the installer as a workflow artifact).
# - release.published: builds the installer and attaches it to the release.
# - workflow_dispatch: builds it as a workflow artifact (kept 14 days).
#
# Code signing is optional. When the repository has the secrets
# WSP_PFX_BASE64 (the .pfx file, base64) and WSP_PFX_PASSWORD, the app and
# installer are Authenticode-signed; without them the installer is unsigned.
on:
  push:
    tags: ["v*"]
    branches: [main, "claude/**"]
    paths: ["VERSION", ".github/workflows/build-windows.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # attach the installer to the release

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
          (cd frontend && npm ci)
          (cd electron && npm ci)

      # VERSION (read by the backend) and electron/package.json (read by
      # Electron) follow the release tag; untagged builds keep the
      # working-copy version.
      - name: Sync version from tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="v$(tr -d '[:space:]' < VERSION)"
          else
            TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          fi
          if [ -z "$TAG" ]; then
            echo "No tag at HEAD; leaving the version untouched."
            exit 0
          fi
          VERSION="${TAG#v}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          printf '%s\n' "$VERSION" > VERSION
          (cd electron && npm version "$VERSION" --no-git-tag-version --allow-same-version)

      - name: Build frontend
        working-directory: frontend
        run: npm run build:check

      - name: Build backend
        working-directory: backend
        run: python -m PyInstaller backend.spec --clean

      # The frozen backend must start and answer /health, with the app's
      # bundled catalog and config, before it goes into an installer.
      - name: Smoke-test the frozen backend
        env:
          WSP_API_PORT: '8799'
          WSP_ENV_PACK_URL: http://127.0.0.1:9/none
        run: |
          ./backend/dist/backend/backend.exe > backend-smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8799/health; then
              echo; curl -fsS http://127.0.0.1:8799/api/ml/models/detection | head -c 600; echo
              kill $PID || true
              exit 0
            fi
            sleep 2
          done
          cat backend-smoke.log
          exit 1

      - name: Import signing certificate (optional)
        env:
          CERT_BASE64: ${{ secrets.WSP_PFX_BASE64 }}
        run: |
          if [ -z "$CERT_BASE64" ]; then
            echo "No WSP_PFX_BASE64 secret: building an unsigned installer."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/wsp_cert.pfx"
          echo -n "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          echo "CSC_LINK=$CERT_PATH" >> "$GITHUB_ENV"

      - name: Package installer
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_KEY_PASSWORD: ${{ secrets.WSP_PFX_PASSWORD }}
        run: |
          npm run build
          npx electron-builder --win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: electron/dist-build/*.exe
          retention-days: 14

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" electron/dist-build/*.exe --clobber

      - name: Publish the release for a pushed tag or VERSION
        if: github.event_name == 'push' && !endsWith(env.RELEASE_TAG, '-dev')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          FLAGS=""
          case "$TAG" in *-*) FLAGS="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A branch push that did not bump VERSION (e.g. a change to this
            # file) must not replace the installer of an existing release
            # with one built from a different commit.
            if [ "${{ github.ref_type }}" != "tag" ]; then
              echo "Release $TAG already exists; bump VERSION to publish a new one."
              exit 0
            fi
          else
            gh release create "$TAG" $FLAGS --target "${{ github.sha }}" --title "WSP CameraTrap ${TAG#v}" \
              --notes "Windows installer for WSP CameraTrap ${TAG#v}. Download WSP-CameraTrap-Setup-${TAG#v}.exe and run it; no admin rights needed."
          fi
          gh release upload "$TAG" electron/dist-build/*.exe --clobber
